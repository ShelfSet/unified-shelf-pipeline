[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-shelf-pipeline"
version = "0.1.0"
description = "Shelf product recognition, price OCR, promotion classification, and alignment."
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
shelf-pipeline = "unified_shelf_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
